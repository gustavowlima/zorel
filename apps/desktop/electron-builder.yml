# Desktop package (D11). The app is only the Electron main process; the Zorel server (compiled Bun binary), the web
# build and the migrations ship as resources next to it. Signing: with CSC_LINK + CSC_KEY_PASSWORD (and APPLE_ID +
# APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID to notarize) it's a Developer ID build, the only kind current macOS
# runs: ad hoc builds and builds signed with an "Apple Development" certificate are refused by AMFI (tested
# 2026-11-04). Without a Developer ID, run the app with `bun run desktop` (dev).
appId: dev.zorel.app
productName: Zorel
directories:
  output: artifacts
  buildResources: assets
files:
  - dist/main.cjs
  - dist/preload.cjs
  - assets/icon.png
  - package.json
asar: true
# Electron fuses (flipped in the binary at build time): the app can't be run as plain Node, take NODE_OPTIONS or
# --inspect, or load code from outside its checked app.asar; cookies are encrypted at rest.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
extraResources:
  - { from: build, to: ., filter: ["zorel-server", "zorel-server.exe"] } # bun --compile adds .exe on Windows
  - { from: build/web, to: web }
  - { from: build/drizzle, to: drizzle }
# Only the app's languages: drops ~40 MB of Chromium locales.
electronLanguages: [en, pt-BR]
# Updates: a GitHub release per version (electron-updater reads it). Owner and repo come from the build's
# environment; without them the app is built the same and just never finds an update.
publish:
  provider: github
  owner: ${env.ZOREL_RELEASE_OWNER}
  repo: ${env.ZOREL_RELEASE_REPO}
mac:
  target: [dmg, zip] # zip: what the updater downloads on macOS
  icon: assets/icon.png
  category: public.app-category.developer-tools
win:
  icon: assets/icon.png
linux:
  icon: assets/icon.png
  target: [AppImage]
