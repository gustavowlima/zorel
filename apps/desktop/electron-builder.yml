# Desktop package (D11). The app is only the Electron main process; the Zorel server (compiled Bun binary), the web
# build and the migrations ship as resources next to it. Version: `version` in package.json; a `v<version>` tag
# releases it (CI). Signing: with CSC_LINK + CSC_KEY_PASSWORD (and APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
# APPLE_TEAM_ID to notarize) it's a Developer ID build. Without them the app is signed ad hoc (scripts/adhoc-sign.cjs)
# and updates through install.sh, but macOS 27 refuses to run ad hoc apps ("Evaluating blocked code", even with no
# quarantine mark; tested 2026-11-04): on macOS only a Developer ID build runs. Until then, `bun run desktop` (dev).
appId: dev.zorel.app
productName: Zorel
directories:
  output: artifacts
  buildResources: assets
files:
  - dist/main.cjs
  - dist/preload.cjs
  - assets/icon.png
  - package.json
asar: true
# No Developer ID: signed ad hoc after packing (scripts/adhoc-sign.cjs); with one, electron-builder signs as usual.
afterSign: scripts/adhoc-sign.cjs
# Electron fuses (flipped in the binary at build time): the app can't be run as plain Node, take NODE_OPTIONS or
# --inspect, or load code from outside its checked app.asar; cookies are encrypted at rest.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
extraResources:
  - { from: build, to: ., filter: ["zorel-server", "zorel-server.exe", "THIRD_PARTY_LICENSES.md"] } # bun --compile adds .exe on Windows; the licenses of what ships
  - { from: build/web, to: web }
  - { from: build/drizzle, to: drizzle }
  # The agents' browser (Playwright's headless Chromium, the server's Playwright version): the app needs no Chrome.
  - { from: build/browsers, to: browsers }
# Only the app's languages: drops ~40 MB of Chromium locales.
electronLanguages: [en, pt-BR]
# Updates: a GitHub release per version (electron-updater reads it), from the same repository install.sh uses.
publish:
  provider: github
  owner: gustavowlima
  repo: zorel
  releaseType: release # published at once: install.sh and the updaters read the latest release, never a draft
mac:
  target: [dmg, zip] # zip: what install.sh (and, with a Developer ID, the updater) downloads
  artifactName: zorel-mac-${arch}.${ext}
  icon: assets/icon.png
  category: public.app-category.developer-tools
win:
  icon: assets/icon.png
linux:
  icon: assets/icon.png
  executableName: zorel # the default comes from the package name, @zorel/desktop, which AppImage refuses
  target: [AppImage]
  artifactName: zorel-linux-${arch}.${ext}
