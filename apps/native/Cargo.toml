[package]
name = "zorel-native"
version = "0.0.0"
description = "Zorel's native desktop client (spec 019)"
publish = false
edition.workspace = true
license.workspace = true

[features]
# Development only: hot-patch function bodies with `dx serve --hot-patch --features hotreload` (Subsecond).
hotreload = ["dep:subsecond", "dep:dioxus-devtools"]

[dependencies]
subsecond = { version = "=0.7.10", optional = true }
dioxus-devtools = { version = "=0.7.10", optional = true }
# Only gpui-base (unstyled behaviour): Zorel draws its own components. Pinned exactly; bump the whole gpui-pre family
# together (apps/native/AGENTS.md › Release).
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.12" # the patterns typify generates checks for (src/net/types.rs)
# Network on one tokio runtime: HTTP to the engine (reqwest; rustls for team servers), RPC over WebSocket.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
getrandom = "0.4" # the per-launch session secret
dirs = "7" # where interface preferences live (state/prefs.rs)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] } # local time for ages, times and dates (format.rs)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Text from packages/i18n (locales/<lang>.json), gpui-kit's i18n convention; plural rules from ICU; the system language.
rust-i18n = "4.2"
icu_plurals = "2"
icu_locale_core = "2"
sys-locale = "0.3"
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-kit"] } # tray / menu-bar icon on GPUI's own loop (no GTK)
image = { version = "0.25", default-features = false, features = ["png"] } # the tray icon (jpeg joins for the browser panel)
notify-rust = "4" # system notifications for approvals, questions and routine notices
pulldown-cmark = { version = "0.13", default-features = false } # replies are markdown; raw HTML is never rendered
alacritty_terminal = "0.26.0" # the Terminal tab's emulator (grid, escapes, selection), Apache-2.0 (spec 019 T058)
base64 = "0.22" # the browser cards' previews come as base64 JPEG (already in the tree via reqwest)

[build-dependencies]
# Wire types generated from packages/contracts/schema/wire.json (build.rs).
typify = "=0.8.0"
schemars = "0.8"
serde_json = "1"
syn = "3"
prettyplease = "0.3"

[[bin]]
name = "zorel-native"
path = "src/main.rs"

[package.metadata.cargo-machete]
# Used only by the generated wire types (OUT_DIR/wire.rs), which cargo-machete doesn't read.
ignored = ["regress"]
