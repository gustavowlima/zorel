[package]
name = "zorel-native"
version = "0.0.0"
description = "Zorel's native desktop client (spec 019)"
publish = false
edition.workspace = true
license.workspace = true

[dependencies]
# Only gpui-base (unstyled behaviour): Zorel draws its own components. Pinned exactly; bump the whole gpui-pre family
# together (apps/native/AGENTS.md › Release).
gpui-kit = { version = "=0.9.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.12" # the patterns typify generates checks for (src/net/types.rs)
# Network on one tokio runtime: HTTP to the engine (reqwest; rustls for team servers), RPC over WebSocket.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
getrandom = "0.4" # the per-launch session secret

[build-dependencies]
# Wire types generated from packages/contracts/schema/wire.json (build.rs).
typify = "=0.8.0"
schemars = "0.8"
serde_json = "1"
syn = "3"
prettyplease = "0.3"

[[bin]]
name = "zorel-native"
path = "src/main.rs"

[package.metadata.cargo-machete]
# Used only by the generated wire types (OUT_DIR/wire.rs), which cargo-machete doesn't read.
ignored = ["regress", "serde_json"]
