name: native

# The native desktop client (spec 019). Runs only when the client or one of its generated sources changes; ci.yml
# ignores apps/native, so each toolchain only runs for its inputs.
on:
  push:
    branches: [main]
    paths:
      - apps/native/**
      - packages/contracts/**
      - packages/i18n/**
      - apps/web/src/styles.css
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .rustfmt.toml
      - _typos.toml
      - .github/workflows/native.yml
  pull_request:
    paths:
      - apps/native/**
      - packages/contracts/**
      - packages/i18n/**
      - apps/web/src/styles.css
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .rustfmt.toml
      - _typos.toml
      - .github/workflows/native.yml

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # GPUI's Linux build needs these (same set gpui-kit's CI installs on Ubuntu 24.04).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      # The toolchain comes from rust-toolchain.toml (rustup reads it on first cargo call).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-
      - run: cargo install --locked typos-cli cargo-machete cargo-deny
      - run: bun install --frozen-lockfile
      - run: bun run native:check
        shell: bash
      - run: cargo test -p zorel-native --locked
