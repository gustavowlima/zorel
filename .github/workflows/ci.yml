name: ci

on:
  push:
    branches: [main]
    tags: ["v*"] # a release
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:ui
      - run: bun run check:i18n
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # What depends on the system (the process table, ports, shells), on the systems not covered above: the full
  # suite runs on Linux; these run on macOS and Windows for real.
  systems:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test apps/server/src/procs.test.ts apps/server/src/terminals.test.ts apps/server/src/engines/acp.test.ts

  desktop:
    # The desktop app for each system: .dmg/.zip (macOS), installer (Windows), AppImage (Linux). Signs only when the
    # secrets exist (see apps/desktop/electron-builder.yml).
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [check, systems]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run desktop:build
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }} # the Developer ID; Windows signing would take WIN_CSC_LINK
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: zorel-${{ runner.os }}
          path: apps/desktop/artifacts/

  release:
    # A tag v* builds, signs (with the secrets) and publishes the app for each system to one GitHub release, which
    # the installed apps update from. Without CSC_LINK the macOS build is signed ad hoc: it installs and updates with install.sh.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, systems]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOREL_RELEASE_OWNER: ${{ github.repository_owner }}
          ZOREL_RELEASE_REPO: ${{ github.event.repository.name }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }} # the Developer ID; Windows signing would take WIN_CSC_LINK
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The installer (macOS and Linux; how a macOS build without a Developer ID updates), with this repository in it.
      - if: runner.os == 'Linux'
        run: sed "s|__REPO__|${{ github.repository }}|" apps/desktop/scripts/install.sh > install.sh && gh release upload "${{ github.ref_name }}" install.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

