name: ci

on:
  push:
    branches: [main]
    tags: ["v*"] # a release
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:ui
      - run: bun run check:i18n
      - run: bun run typecheck
      - run: bun run test
      # Memory invariants on 1,000 memories, no model (apps/server/bench): recall in the needles' words, no leaks.
      - run: bun apps/server/bench/memory-recall.bench.ts 1000 --check
      - run: bun run build

  # What depends on the system (the process table, ports, shells), on the systems not covered above: the full
  # suite runs on Linux; these run on macOS and Windows for real.
  systems:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test apps/server/src/procs.test.ts apps/server/src/terminals.test.ts apps/server/src/engines/acp.test.ts

  desktop:
    # The desktop app for each system: .dmg/.zip (macOS), installer (Windows), AppImage (Linux). Signs only when the
    # secrets exist (see apps/desktop/electron-builder.yml).
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [check, systems]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD # an empty secret would be read as a path
          bun run desktop:build
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }} # the Developer ID; Windows signing would take WIN_CSC_LINK
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zorel-${{ runner.os }}
          path: apps/desktop/artifacts/

  # One release per tag, made before the builds: three jobs that each found none created three (2026-11-04).
  release-create:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, systems]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "$TAG" --verify-tag --notes "See CHANGELOG.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  release:
    # A tag v* builds, signs (with the secrets) and publishes the app for each system to one GitHub release, which
    # the installed apps update from. Without CSC_LINK the macOS build is signed ad hoc: it installs and updates with install.sh.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, systems, release-create]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The signing secrets live in this environment: in Settings › Environments › release, require a reviewer and
    # allow only tags v* to deploy, so a pushed tag alone can't publish a signed build.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # A missing secret arrives as an empty CSC_LINK, which electron-builder reads as a path: unset it (ad hoc signing).
      - run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          bun run --cwd apps/desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }} # the Developer ID; Windows signing would take WIN_CSC_LINK
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The installer (macOS and Linux; how a macOS build without a Developer ID updates), next to the builds.
      - if: runner.os == 'Linux'
        run: gh release upload "$TAG" apps/desktop/scripts/install.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }} # through env, never pasted into the script

